  <rect x="16" y="196" width="208" height="42" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)"/>
  <text x="120" y="216" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
