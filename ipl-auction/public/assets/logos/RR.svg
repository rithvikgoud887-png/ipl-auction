      <stop offset="0%" stop-color="#EA1A85"/>
      <stop offset="100%" stop-color="#A00B55"/>
    </radialGradient>
    <filter id="glow_RR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#004BA0" flood-opacity="0.5"/>
